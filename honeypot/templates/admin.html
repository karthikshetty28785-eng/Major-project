<!DOCTYPE html>
<html>
<head><title>SecureBank — Admin</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
    .nav { background: #1a3c6e; color: white; padding: 14px 24px; }
    .nav a { color: white; text-decoration: none; margin-left: 20px; }
    .content { padding: 30px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background: #c0392b; color: white; padding: 12px; text-align: left; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    h2 { color: #c0392b; }
  </style>
</head>
<body>
  <div class="nav"><span>SecureBank Admin Panel</span>
    <a href="/dashboard">Dashboard</a>
    <a href="/logout">Logout</a>
  </div>
  <div class="content">
    <h2>Employee Management</h2>
    <table>
      <tr><th>ID</th><th>Full Name</th><th>Username</th><th>Role</th></tr>
      {% for e in employees %}
      <tr><td>{{ e[0] }}</td><td>{{ e[1] }}</td><td>{{ e[2] }}</td><td>{{ e[3] }}</td></tr>
      {% endfor %}
    </table>
  </div>
</body>
</html>
